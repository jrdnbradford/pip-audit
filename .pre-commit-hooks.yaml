- id: pip-audit
  name: pip-audit
  description: "Audits Python environments and dependency trees for known vulnerabilities"
  entry: pip-audit
  pass_filenames: false
  language: python
- id: pip-audit-manifest
  name: pip-audit-manifest
  description: "Audit requirements.txt and pyproject.toml files for vulnerabilities"
  entry: scripts/pip_audit_manifest.py
  language: python
  files: '(requirements\.txt|pyproject\.toml)$'
  pass_filenames: true
